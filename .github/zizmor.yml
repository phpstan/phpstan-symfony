rules:
  secrets-outside-env:
    config:
      # Repository-level secrets used by release automation; they are not scoped to deployment environments.
      allow:
        - PHPSTAN_BOT_TOKEN
        - MASTODON_ACCESS_TOKEN
        - TWITTER_CONSUMER_API_KEY
        - TWITTER_CONSUMER_API_SECRET
        - TWITTER_ACCESS_TOKEN
        - TWITTER_ACCESS_TOKEN_SECRET
